      - {role: assistant, content: "That's great to hear! Since you've been off running for a while, build back gradually. A run-walk interval format works well for the first couple of weeks."}
      - {role: user, content: "What would a first week look like?"}
      - {role: assistant, content: "Try three sessions: one minute easy jog, two minutes walk, repeated eight times. Keep every session on soft ground if you can and leave a rest day between them. If the shin ache comes back, drop back a step."}
    expect:
      ops:
        - one_of:
            - {op: DELETE, id: f1}
            - {op: UPDATE, id: f1, groups: [["cleared", "gone", "recovered", "run again", "resolved", "no longer"]]}
      forbidden: []
      forbidden_ops:
        - {op: DELETE, id: f2}

  # ── 9. User thay đổi fact đã lưu → UPDATE (tiếng Việt) ─────────────────
