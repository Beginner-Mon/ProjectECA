          assistant: "Đã nhớ bạn làm y tá ca đêm."
    - turns:
        - user: "Quên hết những gì bạn đã ghi về tôi đi."
          assistant: "Đã quên hết."
  db_probes:
    - group: j
      note: "everything forgotten"
      assert_rows:
        - {fact_contains: "y tá", valid: false}

# Nhóm m: câu gộp hai ý + cổng clarify (chỉ cho M0/M1/M2 và B4, chạy /chat thật).
# m_name/m_food kiểm cả hai ý có trong câu trả lời và kb_search được gọi.
# (m_ambig đã xoá 16/10/2026 cùng resume_last_session: nó tồn tại chỉ để thử
# chế độ hỏi lại do tool đó gây ra.)
- id: m_name
  only_labels: [M0, M1, M2, B4]
  conversations:
    - turns:
        - user: "Tên tôi là Tri, gọi tôi là Mon nhé."
          assistant: "Rõ rồi Mon, tôi sẽ gọi bạn là Mon."
        - user: "Tôi thích ăn phở."
          assistant: "Đã nhớ bạn thích ăn phở."
  probes:
    - group: m
      ask: "who am I? tôi bị đau lưng, gợi ý vài bài tập giúp tôi"
      where: new
      expect_any: []
      expect_all: [["mon"], ["lung"]]
      expect_tools: ["kb_search"]
      forbid_mode: "clarify"
      forbid: []

- id: m_food
  only_labels: [M0, M1, M2, B4]
  conversations:
    - turns:
        - user: "Món ăn yêu thích của tôi là phở."
          assistant: "Đã nhớ món yêu thích của bạn là phở."
