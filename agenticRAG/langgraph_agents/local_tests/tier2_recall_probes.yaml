# Tier-2 recall probe V0 — đo offline bằng model embed, không LLM, không DB.
#
# Facts viết đúng kiểu extractor ghi (fact_text + project hoặc null).
# Mỗi probe gắn nhãn fact đúng (expect) hoặc null khi là câu nhiễu.
# Scorer tính đúng như nodes/memory.py::_load_tier2_facts:
#   fact embed  = passage:"<project>: <fact>" (có project) hoặc passage:"<fact>"
#   query embed = query: cả tin nhắn + từng câu tách ra (_split_tier2_queries),
#                 điểm mỗi fact là MAX giữa các vector.

