      - {role: user, content: "Ừ, hôm nay chắc mình chỉ tập nhẹ thôi."}
      - {role: assistant, content: "Như vậy là hợp lý. Bạn thử bài thở bụng 5 phút và vài động tác xoay cổ vai thật nhẹ, rồi nghỉ sớm."}
    expect:
      ops: []
      forbidden: ["tired", "sleep", "mệt", "ngủ", "fatigue"]

