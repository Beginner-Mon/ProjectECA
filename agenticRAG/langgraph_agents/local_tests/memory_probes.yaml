# Bộ câu thử cho run_memory_probe.py (memory-v2 A2).
# 20 hội thoại tổng hợp viết tay — không có dữ liệu người dùng thật.
#
# Mỗi hội thoại:
#   id, lang, date (ngày hội thoại, ISO), stored (fact đã lưu), messages
#   (xen kẽ user/assistant, bắt đầu bằng user, kết thúc bằng assistant),
#   expect:
#     ops        — thao tác BẮT BUỘC. op ADD|UPDATE|DELETE; category (tuỳ chọn);
#                  id (UPDATE/DELETE); groups = danh sách nhóm cụm từ, mỗi nhóm
#                  cần ít nhất một cụm xuất hiện trong fact (so khớp không phân
#                  biệt hoa thường và dấu).
#     acceptable — thao tác KHÔNG bắt buộc nhưng chấp nhận được (fact đúng, vô hại).
#     forbidden  — cụm từ không được xuất hiện trong bất kỳ fact nào (so khớp
#                  nguyên văn, không phân biệt hoa thường, giữ dấu).
probes:
  # ── 1. Fact sức khoẻ nói thẳng ─────────────────────────────────────────
  - id: c01_vi_plain_condition
    lang: vi
    date: "2026-10-13"
    stored: []
    messages:
      - {role: user, content: "Chào bạn. Mình bị đau lưng dưới khoảng 2 năm nay, bác sĩ bảo là thoát vị đĩa đệm L4-L5."}
      - {role: assistant, content: "Chào bạn, cảm ơn bạn đã chia sẻ. Đau lưng dưới kéo dài như vậy chắc hẳn rất khó chịu. Mình có thể gợi ý một số bài vận động nhẹ nhàng, nhưng bạn nên trao đổi thêm với bác sĩ điều trị trước khi tăng cường độ nhé."}
      - {role: user, content: "Vậy mình nên tập gì buổi sáng cho đỡ cứng lưng?"}
      - {role: assistant, content: "Bạn có thể thử bài xoay nhẹ hông khi nằm ngửa và bài mèo-bò trên bốn điểm chống. Mỗi bài làm chậm 8-10 lần, dừng ngay nếu thấy đau lan xuống chân. Tránh cúi gập người về phía trước khi mới ngủ dậy."}
    expect:
      ops:
        - {op: ADD, category: condition, groups: [["thoát vị", "đĩa đệm", "L4"]]}
      forbidden: []

  # ── 2. Fact sức khoẻ nói thẳng (tiếng Anh, phẫu thuật) ─────────────────
  - id: c02_en_plain_surgery
    lang: en
    date: "2026-10-13"
    stored: []
    messages:
      - {role: user, content: "I had ACL reconstruction on my right knee in March 2025."}
      - {role: assistant, content: "Thanks for telling me. That's a big recovery, and a year and a half out you're probably well into strengthening. How is the knee feeling day to day?"}
      - {role: user, content: "Mostly fine. What can I do to strengthen it further?"}
      - {role: assistant, content: "Good options are step-ups, single-leg glute bridges and slow tempo squats within a comfortable range. Aim for two or three sessions a week and stop if you feel sharp pain or the knee feels unstable. Your surgeon or physio can tell you which load level is right for you."}
    expect:
      ops:
        - {op: ADD, category: condition, groups: [["ACL"], ["2025", "March", "right knee", "right"]]}
      forbidden: []

  # ── 3. Fact lẫn trong chuyện phiếm ─────────────────────────────────────
  - id: c03_vi_buried_small_talk
    lang: vi
    date: "2026-10-13"
    stored: []
    messages:
      - {role: user, content: "Hôm nay trời đẹp ghê, mình vừa đi chợ về xong. À mà mình bị tiểu đường type 2 nên phải kiêng đồ ngọt lắm. Bạn gợi ý giúp mình bài tập nhẹ buổi sáng được không?"}
      - {role: assistant, content: "Nghe thích quá, đi chợ sáng sớm là một cách vận động rất tốt đó. Với buổi sáng, bạn có thể đi bộ nhanh 15-20 phút rồi giãn cơ nhẹ nhàng. Nếu bạn đang dùng thuốc hạ đường huyết, hãy ăn nhẹ trước khi tập và mang theo ít đường phòng khi cần."}
      - {role: user, content: "Cảm ơn bạn, mình sẽ thử."}
      - {role: assistant, content: "Chúc bạn có buổi sáng thật vui. Nếu thấy chóng mặt hay run tay khi tập thì nghỉ ngay và đo lại đường huyết nhé."}
    expect:
      ops:
        - {op: ADD, category: condition, groups: [["tiểu đường", "đái tháo đường", "type 2", "diabetes"]]}
      acceptable:
        - {op: ADD, groups: [["đồ ngọt", "kiêng", "ngọt"]]}
      forbidden: ["đi chợ"]

  # ── 4. Fact lẫn trong chuyện phiếm (tiếng Anh) ─────────────────────────
  - id: c04_en_buried_small_talk
    lang: en
    date: "2026-10-13"
    stored: []
    messages:
      - {role: user, content: "Ha, my cat knocked my coffee over again this morning. Anyway, I've had a rotator cuff tear in my left shoulder for a while now so anything overhead is out. Can you suggest an upper body workout?"}
      - {role: assistant, content: "Cats and coffee, a classic. For an upper body session that keeps your hands below shoulder height, you could do rows with a band, bicep curls and wall push-ups. Keep the range comfortable and stop if the shoulder pinches."}
      - {role: user, content: "Nice, the band rows sound good."}
      - {role: assistant, content: "Great. Start with two sets of twelve with a light band and slow control on the way back. Let me know if you'd like a progression for next week."}
    expect:
      ops:
        - {op: ADD, category: condition, groups: [["rotator cuff"]]}
      acceptable:
        - {op: ADD, category: restriction, groups: [["overhead"]]}
      forbidden: ["cat", "coffee"]

  # ── 5. Assistant giả định điều user không xác nhận (tiếng Việt) ────────
  - id: c05_vi_assistant_assumes
    lang: vi
    date: "2026-10-13"
    stored: []
    messages:
      - {role: user, content: "Mình hay ngồi máy tính nhiều, cổ cứng lắm. Có bài nào giãn cổ không?"}
      - {role: assistant, content: "Với tình trạng cổ cứng kéo dài, nhiều khả năng bạn đang bị thoái hóa đốt sống cổ hoặc thoát vị đĩa đệm cổ. Bạn nên đi chụp MRI để chắc chắn. Trong lúc đó, bạn có thể nghiêng đầu sang hai bên, giữ 15 giây mỗi bên, lặp lại 3 lần."}
      - {role: user, content: "Ừ, cho mình thêm vài bài giãn cơ đơn giản nữa đi."}
      - {role: assistant, content: "Bạn thử thêm bài xoay vai ra sau 10 lần và bài đặt tay lên đầu, kéo nhẹ đầu về một bên. Làm chậm và đều hơi thở, đừng giật mạnh."}
    expect:
      ops: []
      acceptable:
        - {op: ADD, groups: [["cổ cứng", "cứng cổ", "ngồi máy tính", "ngồi nhiều"]]}
      forbidden: ["thoái hóa", "đốt sống cổ", "MRI"]

  # ── 6. Assistant gợi ý điều user không nói (tiếng Anh) ─────────────────
  - id: c06_en_assistant_suggests
    lang: en
    date: "2026-10-13"
    stored: []
    messages:
      - {role: user, content: "Can you give me a 10 minute morning routine?"}
      - {role: assistant, content: "Sure. Since you probably have tight hips from sitting and maybe some mild sciatica, I'd start with gentle hip openers, then a few cat-cows and finish with a standing forward fold. Take each move slowly and breathe."}
      - {role: user, content: "Sounds good, thanks."}
      - {role: assistant, content: "You're welcome. Let me know if you'd like a shorter evening version as well."}
    expect:
      ops: []
      forbidden: ["sciatica", "tight hips"]

  # ── 7. User phủ định fact đã lưu → DELETE (tiếng Việt) ─────────────────
  - id: c07_vi_negate
    lang: vi
    date: "2026-10-13"
    stored:
