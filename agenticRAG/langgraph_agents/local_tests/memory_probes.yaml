      - {role: assistant, content: "Bài bước lên bậc thấp (step-up) rất hợp, bắt đầu với bậc cao 10-15 cm, 2 hiệp 8 lần mỗi chân. Giữ đầu gối thẳng hàng với ngón chân và bước xuống thật chậm."}
    expect:
      ops:
        - {op: UPDATE, id: f1, type: profile, groups: [["cầu thang", "stairs", "stair"]]}
      forbidden: []

  # ── 10. User thay đổi fact đã lưu → UPDATE (tiếng Anh) ─────────────────
  - id: c10_en_update
    lang: en
    date: "2026-10-13"
    stored:
      - {id: f1, type: profile, topic: "lower back", fact: "Has lower back pain when sitting for more than an hour", locked: false}
    messages:
      - {role: user, content: "Quick update: I started seeing a physio and now the pain only comes when I lift heavy things. Sitting is fine."}
      - {role: assistant, content: "That's a nice change. Pain that only shows up under load usually points to what to train rather than what to avoid. Your physio will be the best guide on how heavy to go."}
      - {role: user, content: "Any tips for lifting groceries without it flaring up?"}
      - {role: assistant, content: "Hinge at the hips instead of rounding your back, keep the bags close to your body and split the load between both hands. Two lighter trips are better than one heavy one while it settles."}
    expect:
      ops:
        - {op: UPDATE, id: f1, type: profile, groups: [["lift", "heavy", "nâng"]]}
      forbidden: []

  # ── 11. User mâu thuẫn fact bị KHOÁ → ADD, không UPDATE/DELETE ─────────
