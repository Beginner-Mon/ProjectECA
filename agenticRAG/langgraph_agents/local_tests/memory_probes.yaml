      - {role: assistant, content: "Understood, I'll include higher-intensity options. Since you already train with intervals, I can suggest progressions rather than basics."}
      - {role: user, content: "Great. Give me a 20 minute session for today."}
      - {role: assistant, content: "Try four rounds: 40 seconds of squat jumps, 20 seconds rest, 40 seconds of mountain climbers, 20 seconds rest, then a 1 minute walk between rounds. Warm up for three minutes first."}
    expect:
      ops:
        - {op: ADD, type: preference, groups: [["HIIT", "interval", "high-intensity", "high intensity"]]}
        - {op: DELETE, id: f1}
      forbidden: []

