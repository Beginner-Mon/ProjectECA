# Build the vva-speechllm container image and roll it onto the Lambda.
#
# Modelled on deploy-agent.yml (which itself is modelled on deploy-production.yml
# for kimodo). Two pipelines own the same OIDC trust, same ECR, same account —
# only the repository and function name differ.
#
#   * IMMUTABLE TAGS ONLY. ECR repo vva-speechllm is IMMUTABLE (speechllm_stack.py),
#     so `latest` is not possible. Same reason as deploy-agent.
#   * CDK OWNS THE SHAPE, CI OWNS THE CODE. This workflow never runs `cdk deploy`:
#     it pushes an image and calls update-function-code. Changing memory (D6 chot
#     1769/3538/5308), arch, timeout or env is a CDK deploy a human runs.
#
# Docker lives here and nowhere else — no developer machine needs a daemon
# (rang buoc #5: het RAM/o C:, da co tien le).
#
# OIDC trust is per branch — same note as deploy-agent.yml. If a branch is not
# listed in GitHubActionsECRRole's trust policy, assume-role fails with
# "Not authorized to perform sts:AssumeRoleWithWebIdentity". See that file's
# long comment for how to add a branch (needs the owner/repo IDs form).

name: Deploy SpeechLLM Image

on:
  push:
    branches:
      - release
      - feature/tts-streaming
    paths:
      - 'SpeechLLm/**'
      - '.github/workflows/deploy-speechllm.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "244203483654"
  ECR_REPOSITORY: vva-speechllm
  FUNCTION_NAME: vva-speechllm

concurrency:
  group: deploy-speechllm
  cancel-in-progress: false

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # TWO jobs, two dependency sets — same split as deploy-agent.
  #
  # runtime-imports proves the IMAGE's dependency set is sufficient (no missing
  # libsndfile, no undeclared direct import). unit-tests proves the CODE is
  # correct against the FULL dependency set. Sharing an env makes each a worse
  # test of the other.
  # ───────────────────────────────────────────────────────────────────────────
  runtime-imports:
    name: "📥 Image deps import the app"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the image's dependency set
        run: |
          python -m pip install --upgrade pip
          pip install -r SpeechLLm/requirements.txt

      - name: Import the app (without loading the model)
        run: |
          # vieneu_client imports vieneu==3.6.4 which pulls onnxruntime, numpy,
          # soundfile. The model itself is NOT loaded here — _load_model() runs
          # only on first request / warm-up thread. This import proves the
          # dependency closure is complete without paying 13s model load.
          PYTHONPATH=SpeechLLm python -c "
          from src.services.vieneu_client import VieNeuClient
          import yaml
          cfg = yaml.safe_load(open('SpeechLLm/configs/models.yaml'))['vieneu']
          c = VieNeuClient(cfg)
          print(f'client OK mode={c.mode} codec={c.codec}')
          "
          # Also prove api_server imports without starting uvicorn
          PYTHONPATH=SpeechLLm python -c "
          import api_server
          print(f'api_server OK routes={[r.path for r in api_server.app.routes]}')
          "

  unit-tests:
    name: "🧪 Unit tests"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r SpeechLLm/requirements.txt
          pip install pytest httpx pyyaml

      - name: Run SpeechLLm unit tests
        run: PYTHONPATH=SpeechLLm pytest tests/SpeechLLm -q

  # ───────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: "📦 Build and push"
    needs: [unit-tests, runtime-imports]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      image-uri: ${{ steps.meta.outputs.image-uri }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/GitHubActionsECRRole
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr

      - name: Resolve image URI
        id: meta
        run: |
          echo "image-uri=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Skip build if this commit is already published
        id: exists
        run: |
          if aws ecr describe-images \
               --repository-name "${{ env.ECR_REPOSITORY }}" \
               --image-ids imageTag="${{ github.sha }}" >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ github.sha }} is already in ECR — skipping the build."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      # Context is REPOSITORY ROOT, not SpeechLLm/. The Dockerfile copies
      # SpeechLLm/api_server.py, SpeechLLm/src, SpeechLLm/configs and bakes
      # weights from HuggingFace (pnnbao-ump/VieNeu-TTS-v3-Turbo + MOSS codec)
      # into the HF cache at /root/.cache/huggingface. That bake is what lets
      # HF_HUB_OFFLINE=1 work without a network at cold start.
      - name: Build and push
        if: steps.exists.outputs.already == 'false'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: SpeechLLm/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image-uri }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ───────────────────────────────────────────────────────────────────────────
  deploy:
    name: "🚀 Update function code"
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/GitHubActionsECRRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Does the function exist yet?
        id: fn
        run: |
          if aws lambda get-function --function-name "${{ env.FUNCTION_NAME }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: First run — the image is pushed, the function is not created
        if: steps.fn.outputs.exists == 'false'
        run: |
          echo "::notice::${{ env.FUNCTION_NAME }} does not exist yet — this is the bootstrap run."
          echo "The image is in ECR. Create the function with:"
          echo "    cdk deploy VvaSpeechllmStack -c speechllm_image_tag=${{ github.sha }} -c agent_role_arn=<ARN of vva-agent>"
          echo "Every run after that updates it in place."

      - name: Update the function code
        if: steps.fn.outputs.exists == 'true'
        run: |
          set -euo pipefail
          aws lambda update-function-code \
            --function-name "${{ env.FUNCTION_NAME }}" \
            --image-uri "${{ needs.build-and-push.outputs.image-uri }}" \
            --publish >/dev/null

          aws lambda wait function-updated \
            --function-name "${{ env.FUNCTION_NAME }}"

          echo "::notice::${{ env.FUNCTION_NAME }} now runs ${{ github.sha }}"

      # A green update-function-code only means Lambda ACCEPTED the image. The
      # container may still 500 at INIT (bad CMD, missing libsndfile, weights
      # baked to wrong HF cache path). Smoke it with /health — it needs 503
      # while warming (~13s model + pre-enrol) then 200. Without this the
      # workflow reports success on a function that 502s on every /synthesize.
      - name: Smoke the new image
        if: steps.fn.outputs.exists == 'true'
        run: |
          set -euo pipefail
          aws lambda invoke \
            --function-name "${{ env.FUNCTION_NAME }}" \
            --payload '{"version":"2.0","rawPath":"/health","rawQueryString":"","headers":{"host":"ci.internal"},"requestContext":{"http":{"method":"GET","path":"/health","protocol":"HTTP/1.1","sourceIp":"127.0.0.1"}},"isBase64Encoded":false}' \
            --cli-binary-format raw-in-base64-out \
            /tmp/out.json >/tmp/meta.json

          cat /tmp/meta.json
          cat /tmp/out.json

          if grep -q '"FunctionError"' /tmp/meta.json; then
            echo "::error::The new image fails at invocation. Check CloudWatch for INIT errors."
            exit 1
          fi
