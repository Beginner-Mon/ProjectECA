# Memory benchmark — thu nhỏ cho hạn mức Gemini miễn phí (Tri 14/10/2026).
#
# Hội thoại dựng sẵn KHÔNG chạy qua agent: tin user + câu trả lời viết sẵn được
# ghi thẳng vào `messages` bằng hàm ghi của `db/session_store.py`, rồi gọi
# `housekeep(user_id, session_id)` một lần mỗi hội thoại (A: đánh chỉ mục +
# trích fact; k: chỉ nén). Câu trả lời viết sẵn giúp nhóm c chấm chắc chắn.
#
# Probes: mỗi nhóm a–f đúng 1 probe, chạy `/chat` thật với `VVA_LTM=0` (lượt
# probe không gọi thêm bước trích). Nhóm k không chạy lượt chat nào.
#
# Scoring: chuẩn hoá (chữ thường, bỏ dấu NFD); đạt khi có ≥1 cụm expect_any
# (danh sách rỗng được coi là đúng — nhóm f chỉ kiểm "không rò") và không cụm
# forbid nào. Lượt invalid (node_failed, llm_fallback_used, errors, 429/503/504)
# thì không chấm, chạy lại đúng một lần bằng --retry-invalid.
#
# Nhóm k: mỗi đợt ~10.000 ký tự (vượt history_compact_at 2000 token) để lần nén
# nào cũng có việc làm. Đo ngày 14/10: đợt ~4.300 ký tự chỉ nén được 1 lần cho
# cả 3 đợt gộp lại, nên phải viết dài gấp đôi.

scenarios:

- id: back_a
  conversations:
    - turns:
        - user: "Tôi bị đau lưng dưới mỗi khi ngồi lâu."
          assistant: "Đã nhớ: bạn đau lưng dưới khi ngồi lâu. Tôi sẽ tránh gợi ý động tác gây áp lực lên lưng."
  probes:
    - group: a
      ask: "Nhắc lại xem tôi bị đau ở đâu?"
      where: new
      expect_any: ["lung"]
      forbid: []

- id: latex_b
  conversations:
    - turns:
        - user: "Tôi bị dị ứng latex nên không dùng được dây kháng lực làm từ latex."
          assistant: "Đã nhớ: bạn dị ứng latex. Tôi sẽ chỉ gợi ý dây kháng lực không chứa latex."
  probes:
    - group: b
      ask: "Gợi ý vài bài tập với dây kháng lực cho tôi?"
      where: new
      expect_any: ["latex"]
      forbid: []

- id: ice_c
  conversations:
    - turns:
        - user: "Đầu gối tôi hơi sưng sau khi đi bộ lâu, có nên chườm đá không?"
          assistant: "Bạn nên chườm đá 15 phút mỗi tối, kê cao chân khi nghỉ. Nếu sưng tăng hoặc đau nhiều, hãy đi khám."
  probes:
    - group: c
      ask: "Hôm trước bạn dặn tôi gì về vụ chườm đá?"
      where: new
      expect_any: ["chuom", "da"]
      forbid: []

- id: knee_d
  conversations:
    - turns:
        - user: "Tôi mổ sụn chêm đầu gối trái hồi tháng 5/2025."
          assistant: "Đã nhớ: bạn mổ sụn chêm đầu gối trái tháng 5/2025."
  probes:
    - group: d
      locale: en
      ask: "When did I have my left knee surgery?"
      where: new
      expect_any: ["may", "2025"]
      forbid: []

- id: job_e
  conversations:
    - turns:
        - user: "Tôi làm y tá ca đêm."
          assistant: "Đã nhớ: nghề của bạn là y tá ca đêm."
    - turns:
        - user: "Tôi đã chuyển sang làm giáo viên, không còn làm y tá nữa."
          assistant: "Đã cập nhật: giờ bạn là giáo viên."
  probes:
    - group: e
      ask: "Hiện giờ tôi làm nghề gì?"
      where: last
      expect_any: ["giao vien"]
      forbid: ["y ta"]

- id: goal_f
  conversations:
    - turns:
        - user: "Mục tiêu của tôi là chạy được 5km vào mùa xuân."
          assistant: "Đã nhớ mục tiêu chạy 5km mùa xuân của bạn."
  probes:
    - group: f
      ask: "Thủ đô của Pháp là thành phố nào?"
      where: new
      expect_any: []
      forbid: ["chay", "5km", "xuan"]

# Nhóm k: một hội thoại dài dựng theo 5 đợt, housekeep sau mỗi đợt. Đo ngày 14/10:
# mỗi lần nén ăn khoảng 1,5 đợt nên 3 đợt chỉ cho 2 lần nén, 4 đợt vẫn thiếu ~175
# token so với ngưỡng 2000; đợt 5 đảm bảo lần nén thứ 3. Kiểm bằng từ khoá trong
# bản tóm tắt. Không chạy lượt chat nào.
- id: long_k
  seed_ltm: false
  batches:
    - turns:
        - user: "Từ giờ hãy trả lời tôi ngắn gọn thôi. À, vai phải của tôi hay bị đau mỗi khi giơ tay cao."
          assistant: "Rõ rồi, tôi sẽ trả lời ngắn gọn. Vai phải của bạn đau khi giơ cao — tôi sẽ tránh gợi ý động tác giơ tay quá đầu."
        - user: "Bài heel-slide tập đúng cách thế nào?"
          assistant: "Nằm ngửa, gót chân trượt trên mặt giường về phía mông rồi duỗi ra, giữ lưng dưới chạm mặt giường suốt động tác. Thở đều, không nín thở. Mỗi lần tập khoảng 10 lần, ngày 2 lần, dừng khi đau tăng. Bài này giúp gối gập duỗi nhẹ nhàng sau chấn thương hoặc mổ, vì gót trượt nên khớp chịu ít lực hơn đứng lên ngồi xuống. Nếu gối sưng to sau tập, chườm đá 15 phút và giảm số lần hôm sau. Đừng cố kéo gót quá gần mông khi còn đau nhói. Kết hợp nâng chân thẳng để giữ cơ đùi khỏe, vì cơ đùi yếu làm gối chịu tải nhiều hơn khi đi lại. Ghi lại số lần tập mỗi ngày để tái khám bác sĩ có con số cụ thể. Khi gập gối được khoảng 90 độ mà không đau tăng, bạn có thể hỏi bác sĩ về bài đạp xe tại chỗ không tải, yên cao để gối không gập quá sâu. Sang tuần thứ 3, nếu gối gập êm và không sưng buổi sáng, tăng lên 12 lần mỗi đợt và thêm đợt thứ 3 vào buổi tối. Đừng so sánh tốc độ hồi phục với người khác vì mỗi ca mổ và mỗi độ tuổi khác nhau. Dấu hiệu cần quay lại khám là gối kẹt cứng không duỗi được, sưng nóng kéo dài quá 3 ngày, hoặc đau nhói tăng dần thay vì giảm dần theo tuần. Giữ cân nặng ổn định cũng giúp gối đỡ tải mỗi bước đi."
        - user: "Bài nâng chân thẳng tập mấy hiệp thì đủ?"
          assistant: "Nằm ngửa, một gối gập bàn chân chạm giường, chân còn lại duỗi thẳng rồi nâng lên khoảng 30 cm, giữ 3 giây rồi hạ xuống chậm. Mỗi đợt 10 lần, ngày 2 đến 3 đợt cho mỗi chân, nghỉ 1 phút giữa các đợt. Siết cơ đùi trước khi nâng để đầu gối thẳng hoàn toàn, mũi chân hướng lên trần. Dừng khi thắt lưng võng lên hoặc đau lan xuống bắp chân. Bài này giữ sức cơ tứ đầu đùi mà không bắt gối gập, hợp với người đau gối khi ngồi xổm hoặc leo cầu thang. Tuần đầu chỉ tập không tải, khi nâng 15 lần liên tục mà vẫn nhẹ, bạn có thể đeo tạ cổ chân 0,5 kg rồi tăng dần. Đừng tập ngay sau khi chườm nóng vùng gối đang sưng. Nếu hai chân chênh nhau quá 5 lần mỗi đợt, chân yếu cần được ưu tiên thêm một đợt riêng. Uống đủ nước và khởi động xoay khớp cổ chân vài vòng trước khi tập. Sang tuần thứ 2, nếu nâng êm và lưng không võng, thêm tạ 0,5 kg và giữ nguyên số lần thay vì tăng lần. Đừng tăng tạ và tăng lần cùng một tuần vì cơ chưa kịp thích nghi. Dấu hiệu tập quá sức là đau âm ỉ kéo dài sang hôm sau hoặc phải dùng tay đỡ chân mới nâng được. Ghi lại mức tạ mỗi tuần để tái khám bác sĩ điều chỉnh kịp thời."
        - user: "Đi bộ mỗi ngày bao lâu thì tốt cho khớp gối?"
          assistant: "Người mới bắt đầu nên đi 15 đến 20 phút mỗi ngày trên mặt phẳng, giày đế êm, tốc độ vừa phải còn nói chuyện được. Mỗi tuần tăng thêm 5 phút nếu hôm sau gối không sưng và không đau tăng quá 2 điểm trên thang 10. Mặt đường nhựa phẳng tốt hơn dốc hoặc bậc thang, vì dốc lên xuống tăng áp lực lên bánh chè gấp nhiều lần. Khởi động 3 phút xoay khớp cổ chân và gối nhẹ trước khi đi, thả lỏng 3 phút đi chậm cuối buổi. Nếu đi xong gối kêu lục cục nhưng không đau thì thường không đáng ngại, còn sưng nóng thì nghỉ 1 đến 2 ngày và chườm đá. Đừng đi bộ ngay sau bữa ăn no, cũng đừng để bụng đói lả. Người thừa cân nên chia thành 2 buổi ngắn thay vì một buổi dài để khớp nghỉ giữa chừng. Ghi lại quãng đường và cảm giác gối mỗi tối, sau 2 tuần bạn sẽ thấy pattern nào hợp với mình. Khi đi được 30 phút liên tục mà gối vẫn êm, bạn có thể xen kẽ 1 phút đi nhanh 2 phút đi thường để tăng sức bền. Đừng tăng cả thời gian lẫn tốc độ cùng lúc. Mùa mưa đường trơn thì đi trong nhà hoặc hành lang dài thay vì cố ra ngoài."
        - user: "Bong gân cổ chân nên xử lý ra sao trong 2 ngày đầu?"
          assistant: "Trong 48 giờ đầu hãy nhớ nghỉ, chườm đá, băng ép nhẹ và kê cao chân trên tim. Chườm đá mỗi lần 15 phút, cách nhau ít nhất 1 tiếng, lót khăn mỏng để không bỏng lạnh. Băng thun quấn từ bàn chân lên bắp chân, vừa đủ chặt nhưng ngón chân vẫn hồng và ấm. Kê chân cao hơn tim khi nằm để bớt sưng, tránh đứng lâu hoặc xoa bóp mạnh vào chỗ sưng. Uống thuốc giảm đau theo đơn bác sĩ, đừng tự ý chích hay nắn khớp. Sau 2 ngày nếu sưng giảm và đi lại được thì tập xoay cổ chân nhẹ trong phạm vi không đau, mỗi lần vài phút, ngày vài lần. Đi khám ngay khi không đặt chân xuống đất được, chân tê lạnh, sưng lan nhanh, hoặc nghe tiếng rắc lúc chấn thương. Giày cao cổ tạm thời giúp cố định khi phải di chuyển, nhưng đừng phụ thuộc quá 1 tuần. Khi hết đau hoàn toàn mới tập chạy nhẹ trở lại, bắt đầu bằng đi bộ nhanh xen kẽ. Sang ngày thứ 3 đến 5, nếu sưng xẹp một nửa và đứng một chân được 10 giây, tập viết chữ cái bằng mũi chân để lấy lại linh hoạt. Đừng ngâm chân nước nóng trong tuần đầu vì càng sưng thêm. Tái phát lần 2 cùng một chân thì nên khám chuyên khoa để kiểm tra dây chằng."
        - user: "Bài giãn cơ cổ nào dễ làm ở văn phòng?"
          assistant: "Ngồi thẳng lưng, nghiêng đầu sang phải đến khi má trái căng nhẹ, giữ 20 giây rồi đổi bên, mỗi bên 3 lần. Sau đó cúi cằm về phía ngực giữ 20 giây để giãn gáy, rồi ngửa nhẹ ra sau giữ 10 giây, lặp lại 3 vòng. Vai thả lỏng, đừng nhún vai lên tai khi giãn. Xoay vai 10 vòng ra trước và 10 vòng ra sau để mở khớp vai hay gù khi gõ máy. Mỗi giờ đứng dậy đi lại 2 phút, vươn tay lên cao hít sâu vài lần. Màn hình nên ngang tầm mắt để cổ không cúi quá 20 độ, ghế có tựa lưng dưới. Tránh bẻ cổ kêu rắc mạnh hoặc nhờ người khác ấn cổ. Nếu tê lan xuống tay, đau tăng về đêm, hoặc chóng mặt khi ngửa cổ thì dừng tập và đi khám. Uống nước đều vì ngồi điều hòa lâu dễ cứng cơ. Dán giấy nhớ trên màn hình để nhắc giãn cơ mỗi giờ trong tuần đầu tạo thói quen. Sau 2 tuần đều đặn, thêm động tác rút cằm về sau giữ 5 giây, 10 lần mỗi đợt để khỏe cơ sâu quanh cổ. Đừng tập khi đang đau cấp sau ngủ sai tư thế, hãy chườm ấm 10 phút trước rồi mới giãn nhẹ."
        - user: "Người mới mổ gối nên ăn uống thế nào để mau hồi phục?"
          assistant: "Sau mổ gối, mỗi bữa ăn nên có một phần đạm bằng lòng bàn tay như thịt nạc, cá, trứng hoặc đậu phụ để liền mô, kèm rau xanh và cơm vừa đủ no. Cá hồi cá thu 2 bữa mỗi tuần vừa có đạm vừa có chất béo tốt giúp bớt viêm quanh khớp. Sữa hoặc sữa chua mỗi ngày một cốc để bổ sung canxi, kết hợp phơi nắng sáng 15 phút giúp cơ thể tổng hợp vitamin D. Uống đủ 2 lít nước mỗi ngày vì thuốc giảm đau dễ gây táo bón, ăn thêm rau khoai củ quả để nhuận tràng tự nhiên. Tránh rượu bia trong ít nhất 1 tháng sau mổ vì làm chậm liền vết thương và tương tác với thuốc kháng sinh giảm đau. Đừng ăn kiêng kham khổ để giảm cân ngay lúc này vì cơ thể đang cần năng lượng hồi phục, giữ cân ổn định là đủ. Nếu chán ăn do tác dụng phụ của thuốc, chia thành 5 bữa nhỏ thay vì 3 bữa lớn và ưu tiên món dễ tiêu. Người tiểu đường cần đo đường huyết thường xuyên hơn vì stress sau mổ làm đường huyết dao động khó lường. Hỏi bác sĩ trước khi uống bất kỳ thực phẩm chức năng nào vì có loại làm loãng máu nguy hiểm sau mổ. Ghi lại cân nặng mỗi tuần để tái khám bác sĩ đánh giá dinh dưỡng."
        - user: "Ngủ có giúp khớp gối hồi phục sau mổ không?"
          assistant: "Ngủ đủ 7 đến 8 tiếng mỗi đêm giúp cơ thể tiết hormone tăng trưởng để liền mô và giảm sưng nề quanh gối. Nằm ngửa kê gối mỏng dưới bắp chân để gối duỗi thẳng tự nhiên, tránh nằm sấp vì gối gập cả đêm sẽ cứng buổi sáng. Nếu nằm nghiêng thì kẹp gối ôm giữa hai chân để hông và gối thẳng hàng. Uống thuốc giảm đau đúng giờ buổi tối theo đơn để không bị đau thức giấc nửa đêm. Phòng ngủ mát tối yên tĩnh, tắt điện thoại 30 phút trước khi ngủ vì ánh sáng xanh làm khó vào giấc. Đừng uống cà phê sau 2 giờ chiều vì mất ngủ làm hôm sau đau nhức tăng rõ rệt. Ngủ trưa 20 phút là đủ, ngủ trưa quá dài gây khó ngủ ban đêm. Nếu đau nhức khiến trằn trọc quá 1 tuần, báo bác sĩ để điều chỉnh thuốc chứ đừng tự tăng liều. Dậy buổi sáng thì ngồi dậy từ từ, xoay khớp cổ chân vài vòng trên giường trước khi đặt chân xuống đất. Ghi lại giờ ngủ và mức đau sáng hôm sau trong 1 tuần để thấy mối liên quan và điều chỉnh."
    - turns:
        - user: "Bài nâng bắp chân đứng tập thế nào cho đúng?"
          assistant: "Đứng hai chân rộng bằng hông, vịn ghế chắc phía trước, kiễng gót lên cao nhất có thể rồi hạ xuống chậm trong 3 giây. Mỗi đợt 12 lần, ngày 3 đợt, nghỉ 1 phút giữa đợt. Dồn lực đều hai chân, đừng nghiêng người ra trước hay nín thở. Khi làm 15 lần liên tục thấy nhẹ, chuyển sang tập từng chân một, mỗi chân 10 lần. Bài này khỏe cơ bắp chân giúp cổ chân vững khi đi bộ và leo cầu thang, giảm nguy cơ bong gân tái phát. Đừng tập trên nền trơn hoặc đi chân trần trên sàn ướt. Nếu đau gân gót buổi sáng thì khởi động xoay cổ chân 1 phút trước khi tập và giảm một nửa số lần trong 3 ngày. Giày gót thấp êm tốt hơn dép lê mỏng. Sau 1 tháng đều đặn, bạn có thể thử kiễng trên bậc thang để gót hạ sâu hơn, nhưng luôn có tay vịn bên cạnh. Ghi lại số lần mỗi tối để thấy tiến bộ từng tuần. Khi tập một chân êm được 2 tuần, thêm ba lô nhẹ 2 đến 3 kg để tăng tải từ từ. Đừng tăng tải khi gân gót còn đau buổi sáng quá 10 phút mới hết. Dấu hiệu quá tải là đau dọc gân gót tăng dần theo tuần thay vì giảm. Xen kẽ ngày tập nặng với ngày chỉ xoay khớp nhẹ để gân có thời gian hồi phục."
        - user: "Đau gân kheo sau khi chạy nên nghỉ bao lâu?"
