          assistant: "Đứng hai chân rộng bằng vai, mũi chân hơi chếch ra ngoài, từ từ hạ mông xuống như ngồi ghế tưởng tượng, chỉ xuống khoảng 30 độ gập gối rồi đứng lên. Đầu gối không vượt quá mũi chân, trọng lượng dồn vào gót chân. Mỗi đợt 8 lần, ngày 2 đợt, nghỉ 1 phút giữa đợt. Tay vịn ghế phía trước để giữ thăng bằng và giảm tải cho gối. Dừng khi đau nhói mặt trước gối hoặc nghe tiếng lục cục kèm đau. Bài này giữ cơ đùi khỏe mà không bắt gối gập sâu, hợp với người thoái hóa nhẹ hoặc sau chấn thương đang hồi phục. Đừng xuống quá sâu kiểu squat đủ sâu khi gối còn đau, sâu thêm chỉ khi 2 tuần liền không tăng đau. Thở ra khi đứng lên, hít vào khi hạ xuống. Kết hợp nâng chân thẳng xen kẽ ngày để cơ đùi phát triển đều. Ghi lại độ sâu và cảm giác đau mỗi buổi để tái khám có số liệu. Sau 3 tuần êm, tăng lên 10 lần mỗi đợt và thêm đợt thứ 3 vào buổi tối. Đừng cầm thêm tạ khi form chưa vững vì lưng sẽ gánh thay gối. Xuống thang bộ chậm thay vì thang máy là cách tập thêm gối mỗi ngày."
        - user: "Chườm nóng và chườm lạnh khác nhau thế nào?"
          assistant: "Chườm lạnh dùng cho chấn thương mới trong 48 giờ đầu hoặc chỗ đang sưng nóng, mỗi lần 15 phút cách nhau ít nhất 1 tiếng và luôn lót khăn mỏng để không bỏng lạnh. Chườm nóng dùng cho cứng cơ mãn tính hoặc đau ê ẩm lâu ngày không sưng, mỗi lần 15 đến 20 phút bằng khăn ấm hoặc túi chườm. Tuyệt đối không chườm nóng lên chỗ đang sưng to vì càng sưng thêm và đau tăng. Sau tập luyện gây ê ẩm nhẹ thì tắm nước ấm hoặc chườm ấm giúp cơ thả lỏng nhanh. Người tiểu đường hoặc mất cảm giác da phải thử nhiệt độ bằng vùng da lành trước vì dễ bỏng mà không biết. Đừng chườm bất kỳ thứ gì lên vết thương hở hoặc vùng da đang viêm đỏ lan rộng. Xen kẽ nóng lạnh chỉ nên làm khi có hướng dẫn của vật lý trị liệu, tự ý làm dễ sai nhịp. Ghi lại sau mỗi lần chườm xem sưng đau thay đổi thế nào để tái khám bác sĩ có thông tin. Nếu chườm đúng 3 ngày mà sưng không giảm chút nào thì nên đi khám thay vì đổi qua đổi lại."
        - user: "Khi nào người đau gối nên đi khám lại?"
          assistant: "Đi khám ngay khi gối kẹt cứng không duỗi thẳng được, sưng nóng đỏ lan nhanh, hoặc đau dữ dội về đêm không ngủ được. Hẹn khám sớm trong tuần khi đau tăng dần sau 2 tuần tập đúng, sưng tái đi tái lại, hoặc đi lại nghe tiếng lục cục kèm đau. Mang theo sổ ghi số lần tập, mức đau mỗi ngày và loại thuốc đang uống để bác sĩ đánh giá nhanh. Kể rõ cơ chế chấn thương nếu có như ngã, xoay người đột ngột, hay đau tự nhiên không rõ lý do. Đừng giấu việc tự ý uống thêm thuốc giảm đau vì ảnh hưởng đến quyết định kê đơn. Hỏi bác sĩ 3 câu trước khi về là bệnh của mình ở mức nào, bài tập nào được và không được làm, khi nào cần tái khám. Giữ lại phim chụp cũ để so sánh tiến triển thay vì chụp lại tốn kém. Nếu bác sĩ chỉ định vật lý trị liệu thì đi đủ số buổi vì bỏ dở giữa chừng dễ tái phát. Đừng chuyển sang thầy khác mỗi tuần vì mỗi người một phác đồ, khớp không kịp thích nghi."
    - turns:
        - user: "Trời lạnh khớp gối đau hơn phải làm sao?"
          assistant: "Trời lạnh làm dịch khớp đặc lại và cơ co cứng nên gối đau tăng là chuyện thường gặp, không hẳn bệnh nặng thêm. Giữ ấm đầu gối bằng quần dài hoặc băng gối mỏng khi ra ngoài, đừng để gió lùa trực tiếp vào khớp. Buổi sáng khởi động trên giường 3 phút co duỗi gối nhẹ trước khi đặt chân xuống đất lạnh. Tắm nước ấm và chườm ấm 15 phút buổi tối giúp cơ mềm và ngủ ngon hơn. Vẫn duy trì đi bộ nhẹ trong nhà thay vì nằm ì cả ngày vì bất động làm khớp càng cứng. Uống đủ nước ấm vì trời lạnh ít khát nên hay quên uống, thiếu nước làm sụn khớp kém đàn hồi. Ăn đủ chất, đừng vì lười đi chợ mùa lạnh mà ăn uống qua loa thiếu đạm. Nếu đau tăng quá 4 điểm và kéo dài suốt mùa lạnh không đỡ thì đi khám để loại trừ viêm khớp tiến triển. Ghi lại mức đau theo nhiệt độ mỗi ngày trong 2 tuần để biết ngưỡng chịu đựng của mình. Đừng tự ý tăng liều giảm đau chỉ vì trời lạnh, hỏi bác sĩ trước."
        - user: "Nẹp gối có giúp đi lại vững hơn không?"
          assistant: "Nẹp gối loại ôm đơn giản giúp người đau gối đi lại tự tin hơn vì khớp được cố định nhẹ và ấm. Chọn nẹp vừa chu vi gối, đeo khi đi bộ hoặc đứng lâu, tháo ra khi ngồi nghỉ và khi ngủ để da thở. Đừng đeo nẹp cả ngày liên tục quá 2 tuần vì cơ đùi sẽ ỷ lại và yếu đi. Kết hợp tập nâng chân thẳng để cơ khỏe lên rồi giảm dần thời gian đeo nẹp. Nẹp bản lề loại cứng chỉ dùng khi bác sĩ chỉ định sau chấn thương dây chằng, tự mua đeo có thể sai tư thế. Giặt nẹp mỗi tuần vì mồ hôi tích tụ gây ngứa và hôi. Nếu đeo nẹp mà đau tăng hoặc tê bì bàn chân thì nẹp quá chật hoặc sai cỡ, dừng ngay. Người dị ứng vải thun nên lót thêm lớp vải cotton mỏng bên trong. Nẹp không thay được bài tập, nó chỉ là công cụ hỗ trợ tạm thời trong giai đoạn đau. Hỏi bác sĩ hoặc kỹ thuật viên chỉnh hình khi lần đầu chọn nẹp để đúng cỡ và đúng loại."
        - user: "Tập ngồi ghế tựa nâng chân có tác dụng gì?"
          assistant: "Ngồi ghế tựa vững, lưng thẳng chạm tựa, hai tay bám mép ghế rồi duỗi thẳng một chân ngang tầm hông giữ 5 giây rồi hạ xuống chậm. Mỗi chân 10 lần, ngày 2 đợt, nghỉ 30 giây giữa đợt. Bài này khỏe cơ tứ đầu đùi mà người yếu, người lớn tuổi hoặc người sợ ngã vẫn tập được an toàn. Thở ra khi nâng lên, hít vào khi hạ xuống, đừng nín thở. Siết cơ đùi trước khi nâng để đầu gối duỗi thẳng hoàn toàn. Dừng khi đau nhói gối hoặc lưng phải gồng lên để nâng. Khi nâng 12 lần dễ dàng sau 2 tuần, buộc thêm túi cát 0,5 kg vào cổ chân để tăng tải từ từ. Ghế phải chắc chắn không bánh xe trượt, tốt nhất kê sát tường. Đừng đung đưa người lấy đà vì lưng dưới chịu hết lực. Kết hợp thêm bài đứng lên ngồi xuống ghế thấp 8 lần để tập cả chuỗi động tác đứng ngồi hàng ngày. Ghi lại số lần mỗi buổi để thấy tiến bộ và báo bác sĩ khi tái khám."
        - user: "Ghi nhật ký đau khớp thế nào cho đúng?"
          assistant: "Mỗi tối ghi 4 dòng là mức đau từ 0 đến 10, lúc nào đau nhất trong ngày, đã làm gì trước lúc đau, và uống thuốc gì. Thêm một dòng về tập luyện gồm bài nào bao nhiêu lần để đối chiếu với cơn đau hôm sau. Ghi bằng sổ giấy để đầu giường hoặc ghi chú điện thoại, quan trọng là cùng một mẫu mỗi ngày. Sau 2 tuần, đọc lại sẽ thấy pattern như đau tăng vào ngày leo cầu thang hoặc đỡ vào ngày chườm ấm. Mang sổ này đi tái khám thay vì kể miệng vì bác sĩ cần con số cụ thể để điều chỉnh phác đồ. Đừng ghi quá chi tiết dài dòng vì nản sau 3 ngày, ngắn gọn đúng mẫu mới duy trì được. Nếu đau đột ngột trên 7 điểm thì ghi thêm giờ giấc và gọi điện hỏi ý kiến bác sĩ thay vì chờ tái khám. Người nhà có thể nhắc ghi mỗi tối trước khi ngủ để tạo thói quen. Nhật ký trung thực cả ngày tốt lẫn ngày xấu, đừng chỉ ghi ngày đau vì bác sĩ cần thấy toàn cảnh."
    - turns:
        - user: "Người lớn tuổi tập với ghế tựa thế nào cho an toàn?"
          assistant: "Người lớn tuổi nên chọn ghế tựa chắc chắn không bánh xe, kê sát tường để không trượt khi vịn. Bài ngồi đứng lên ghế thấp giúp chân khỏe mà an toàn: ngồi sâu, hai tay vịn thành ghế, nghiêng người ra trước rồi đứng lên chậm, mỗi đợt 6 lần ngày 2 đợt. Khi đứng lên được dễ dàng sau 2 tuần, thử đứng không vịn tay 4 lần mỗi đợt. Luôn mang giày đế bám, đừng đi chân trần hoặc dép lê trơn trong nhà. Dọn lối đi thông thoáng, cất dây điện và thảm trơn để không vấp ngã. Tập gần người nhà trong tháng đầu để có người đỡ khi choáng. Đừng tập khi vừa uống thuốc hạ huyết áp vì dễ chóng mặt khi đứng lên. Uống đủ nước vì người lớn tuổi hay quên uống, thiếu nước gây mệt và chuột rút. Ghi lại số lần đứng lên mỗi ngày để tái khám bác sĩ thấy tiến bộ. Nếu ngã dù chỉ một lần thì dừng tập một mình và báo người nhà ngay."
        - user: "Xoa bóp có giúp giảm đau gối không?"
          assistant: "Xoa bóp nhẹ quanh gối giúp máu lưu thông và giảm cứng cơ tạm thời, nhưng không chữa được nguyên nhân bên trong khớp. Xoa theo vòng tròn quanh bánh chè 5 phút mỗi tối với lực vừa phải, kết hợp dầu nóng nhẹ nếu da không dị ứng. Đừng ấn mạnh trực tiếp lên chỗ sưng nóng hoặc bầm tím vì càng tổn thương thêm. Sau xoa bóp nên giãn nhẹ đùi bắp chân để duy trì hiệu quả thả lỏng. Xoa bóp không thay được bài tập khỏe cơ, chỉ là biện pháp hỗ trợ giảm đau trước khi tập. Đừng tin các lời quảng cáo xoa bóp nắn khớp khỏi thoái hóa hoàn toàn vì không có cơ sở. Người đang uống thuốc loãng máu cần xoa thật nhẹ vì dễ bầm tím lan rộng. Nếu xoa xong đau tăng hoặc sưng to hơn hôm sau thì dừng và đi khám. Chọn cơ sở uy tín có người được đào tạo, đừng để người không chuyên bẻ nắn khớp gối. Ghi lại mức đau trước và sau xoa 1 tuần để biết có thật sự hiệu quả với mình không."
        - user: "Đi khám vật lý trị liệu cần chuẩn bị gì?"
          assistant: "Mang theo phim chụp cũ, đơn thuốc đang uống và sổ ghi số lần tập cùng mức đau mỗi ngày để buổi khám hiệu quả. Mặc quần áo rộng thoải mái để bác sĩ kiểm tra khớp dễ dàng, đừng mặc quần bó sát. Liệt kê sẵn 3 việc khó khăn nhất hiện tại như leo cầu thang, ngồi xổm hay đứng lâu để ưu tiên điều trị. Kể rõ tiền sử chấn thương và ca mổ cũ vì ảnh hưởng đến phác đồ tập. Đừng ngại hỏi khi không hiểu bài tập, nhờ kỹ thuật viên làm mẫu chậm một lần rồi tự làm lại trước mặt họ. Ghi lại tên bài tập, số lần và lưu ý riêng vào điện thoại ngay tại buổi khám vì về nhà hay quên. Hỏi rõ lịch tái khám và dấu hiệu nào cần quay lại sớm hơn hẹn. Đi đủ số buổi được chỉ định vì bỏ dở giữa chừng là nguyên nhân tái phát phổ biến nhất. Đừng tập thêm bài ngoài phác đồ khi chưa hỏi vì có bài xung đột nhau. Giữ liên lạc với phòng tập để báo ngay khi đau tăng bất thường giữa liệu trình."
  check_summary:
    keywords: ["vai", "ngan"]
    min_compactions: 3

# Nhóm g–j: chỉ cho B (đọc thẳng user_memory, không chat). Mỗi nhóm 1 mục kiểm.
- id: instr_general_g
  only_labels: [B, B2, B3, B4]
  conversations:
    - turns:
        - user: "Từ giờ hãy trả lời tôi ngắn gọn thôi."
          assistant: "Rõ rồi, tôi sẽ trả lời ngắn gọn."
    - turns:
        - user: "Nhắc lại nhé: trả lời ngắn gọn thôi."
          assistant: "Nhớ rồi, ngắn gọn thôi."
