      - {role: assistant, content: "Mình rất tiếc khi nghe vậy. Bong gân còn sưng thì bạn nên cho chân nghỉ, kê cao khi ngồi và chườm lạnh. Nếu sưng không giảm sau vài ngày hoặc không chịu lực được thì nên đi khám nhé."}
      - {role: user, content: "Trong lúc này mình có thể tập phần thân trên không?"}
      - {role: assistant, content: "Được, bạn có thể tập tay và vai khi ngồi, ví dụ nâng tạ nhẹ hoặc kéo dây kháng lực. Tránh các bài đứng một chân hoặc nhảy cho đến khi mắt cá ổn định hơn."}
    expect:
      ops:
        - {op: ADD, type: profile, groups: [["bong gân", "mắt cá", "sprain", "ankle"]]}
      forbidden: ["tuần trước", "last week"]
      forbidden_ops:
        - {op: DELETE, id: f1}

  # ── 12. User thay thế fact bị KHOÁ → DELETE + ADD (tiếng Anh) ────────────────────────
  - id: c12_en_locked_contradict
    lang: en
    date: "2026-10-13"
    stored:
