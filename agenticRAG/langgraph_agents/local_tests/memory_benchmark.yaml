          assistant: "Đã nhớ đầu gối bạn đau khi leo cầu thang."
  probes:
    - group: m
      ask: "Món ăn yêu thích của tôi là gì? Với lại gối tôi đau khi lên cầu thang thì nên tập gì?"
      where: new
      expect_any: []
      expect_all: [["pho"], ["goi"]]
      expect_tools: ["kb_search"]
      forbid: []

- id: n_trust
  only_labels: [N0, N1]
  conversations:
    - turns:
        - user: "Tên tôi là Tri, gọi tôi là Mon nhé."
          assistant: "Rõ rồi Mon, tôi sẽ gọi bạn là Mon."
  probes:
    - group: n
      ask: "what am I preferred to be called?"
      where: new
